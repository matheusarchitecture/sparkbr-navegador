<body data-spark-page="bico" data-spark-layout="simple">
<div class="wrap">
<a class="back" href="/">← sparkbr.online</a>
<div style="font-size:13px;color:#38bdf8;font-weight:800;margin-top:8px">⚡ SPARK APPS + IA</div>
<h1>💪 Bico & Renda Extra</h1>
<div class="sub">Freela, turno e venda somando pra meta do mês. 10 segundos por lançamento.</div>

<div class="card"><b>🎯 Mês: R$ <span id="ganho">0,00</span> de R$ <span id="meta">0,00</span></b><div class="meta" id="falta">Defina a meta do mês.</div><div class="bar"><i id="bar" style="width:0%"></i></div></div>
<div class="secao">➕ Novo ganho (ou 🎤 fale)</div>
<div class="card"><div class="row"><input id="g-d" placeholder="Ex: bico sábado"><button class="micbtn" id="g-mic">🎤</button></div>
<div class="row"><input id="g-v" inputmode="decimal" placeholder="Valor R$"><input id="g-meta" inputmode="decimal" placeholder="Meta mês R$"></div>
<button class="btn go" id="g-add">Lançar ganho</button></div>
<div class="secao">📋 Ganhos do mês</div>
<div class="card"><div id="lista"></div>
<button class="btn zap" id="zap">📲 Compartilhar conquista</button></div>

<div class="foot">Grátis para sempre · <a href="/">todos os apps</a> · <a href="/financeiro/">Financeiro</a> · <a href="/cofrinho/">Cofrinho</a> · <a href="/familia/">Família</a></div>
</div>
<script src="/spark-casa.js?v=1"></script>
<script>

function mesAtual(){ try{ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2); }catch(e){ return ""; } }
function load(){ return S.get("bico", {ganhos:[],meta:0}); }
function save(o){ S.set("bico", o); }
function render(){
  var o=load(), m=mesAtual(), tot=0, html="";
  var lista=o.ganhos.filter(function(g){ return (g.data||"").slice(0,7)===m; });
  lista.forEach(function(g){ tot+=Number(g.valor||0); html='<div class="item"><div class="tx"><b>'+S.esc(g.desc)+'</b> — R$ '+S.brl(g.valor)+' <span class="meta">'+S.esc(g.data||"")+'</span></div></div>'+html; });
  document.getElementById("ganho").textContent=S.brl(tot);
  document.getElementById("meta").textContent=S.brl(o.meta||0);
  document.getElementById("g-meta").value=o.meta||"";
  document.getElementById("falta").textContent=o.meta?(tot>=o.meta?"Meta batida! 🎉":"Faltam R$ "+S.brl(o.meta-tot)):"Defina a meta do mês.";
  document.getElementById("bar").style.width=(o.meta?Math.min(100,Math.round(tot/o.meta*100)):0)+"%";
  document.getElementById("lista").innerHTML=html||'<div class="meta">Nenhum ganho este mês. Bora?</div>';
}
document.getElementById("g-add").onclick=function(){
  var d=document.getElementById("g-d").value.trim()||"ganho";
  var v=S.num(document.getElementById("g-v").value);
  if(!(v>0)){ S.toast("Valor R$."); return; }
  var o=load(); o.ganhos.push({desc:d.slice(0,60),valor:v,data:S.today()});
  var mv=S.num(document.getElementById("g-meta").value); if(mv>0)o.meta=mv;
  save(o);
  document.getElementById("g-d").value=""; document.getElementById("g-v").value="";
  render(); S.toast("Somado! 💪");
};
S.holdMic(document.getElementById("g-mic"), function(txt){
  document.getElementById("g-d").value=txt.slice(0,60);
  var v=txt.replace(/\./g,"").replace(",",".").match(/(\d+(?:\.\d+)?)/);
  if(v) document.getElementById("g-v").value=v[1];
  S.toast("Confira e toque em Lançar.");
});
document.getElementById("zap").onclick=function(){ S.shareZap("Fiz R$ "+document.getElementById("ganho").textContent+" de renda extra este mês com o Spark!"); };
render();

</script>

<script src="/navegador/bridge/spark-family.js?v=2.1.0"></script>
</body>
