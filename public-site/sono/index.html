<body data-spark-page="sono" data-spark-layout="simple">
<div class="wrap">
<a class="back" href="/">← sparkbr.online</a>
<div style="font-size:13px;color:#38bdf8;font-weight:800;margin-top:8px">⚡ SPARK APPS + IA</div>
<h1>🌙 Cantinho do Sono</h1>
<div class="sub">Desligar 21h30, dormir bem, acordar melhor. 1 toque por noite.</div>

<div class="card"><b>🌙 <span class="streak" id="streak">0</span> <span style="font-size:12px">noites registradas</span></b><div class="meta" id="dica">Toque como foi a noite ao acordar.</div><div class="bar"><i id="bar" style="width:0%"></i></div></div>
<div class="card"><div class="row"><button class="btn go" id="bem">😴 Dormi bem</button><button class="btn warn" id="mal">🥱 Dormi mal</button></div>
<div class="row"><input id="h" type="time" placeholder="Hora de deitar"><input id="w" inputmode="numeric" placeholder="Despertares"></div>
<button class="btn ghost" id="det">Salvar detalhe</button>
<button class="btn warn" id="lembrete">⏰ Avise-me às 21h30</button></div>
<div class="secao">📋 Últimas noites</div>
<div class="card"><div id="lista"></div></div>

<div class="foot">Grátis para sempre · <a href="/">todos os apps</a> · <a href="/saude/">Saúde</a> · <a href="/dose/">Dose</a> · <a href="/escola/">Escola</a></div>
</div>
<script src="/spark-casa.js?v=1"></script>
<script>

var DICAS=["Tela desliga 30 min antes: o sono agradece.","Quarto escuro e fresco dorme melhor.","Café depois das 16h rouba a noite.","Mesmo horário todo dia regula o corpo.","Banho morno 1h antes relaxa."];
function load(){ return S.get("sono", []); }
function save(a){ S.set("sono", a); }
function render(){
  var a=load().slice(-14), html="", boas=a.filter(function(x){return x.q==="bem";}).length;
  document.getElementById("streak").textContent=a.length;
  document.getElementById("bar").style.width=Math.min(100,a.length*10)+"%";
  try{ var d=new Date(); document.getElementById("dica").textContent=DICAS[d.getDate()%DICAS.length]; }catch(e){}
  a.slice().reverse().forEach(function(x){ html+='<div class="item"><div class="tx"><b>'+(x.q==="bem"?"😴 boa noite":"🥱 noite ruim")+'</b> <span class="meta">'+S.esc(x.data||"")+(x.hora?" · deitou "+S.esc(x.hora):"")+(x.w?" · "+S.esc(x.w)+" despertares":"")+'</span></div></div>'; });
  document.getElementById("lista").innerHTML=html||'<div class="meta">Nenhuma noite ainda.</div>';
}
function log(q){
  var a=load();
  if(a.length&&a[a.length-1].data===S.today()){ S.toast("Hoje já registrado. Até amanhã!"); return; }
  a.push({data:S.today(),q:q,hora:document.getElementById("h").value,w:document.getElementById("w").value});
  save(a); S.streakTouch("sono"); document.getElementById("lembrete").onclick=function(){ S.pushLembrete("sono","21:30","Hora de desligar: boa noite!"); };
render(); S.toast(q==="bem"?"Boa! Que venha outra.":"Amanhã será melhor.");
}
document.getElementById("bem").onclick=function(){ log("bem"); };
document.getElementById("mal").onclick=function(){ log("mal"); };
document.getElementById("det").onclick=function(){ S.toast("Detalhe vale junto do próximo registro."); };
render();

</script>
