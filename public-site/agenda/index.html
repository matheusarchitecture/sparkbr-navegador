<style>
body{font-family:system-ui;margin:0;background:#0f172a;color:#fff}
.wrap{max-width:560px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:20px;margin:6px 0}
.sub{color:#94a3b8;font-size:13px;margin-bottom:10px}
.card{background:#fff;color:#0f172a;border-radius:14px;padding:12px;margin:8px 0}
.card b{font-size:14px}
.meta{font-size:11px;color:#475569;margin-top:3px}
.secao{font-size:13px;font-weight:800;color:#38bdf8;margin:16px 0 4px}
.bar{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#38bdf8)}
.btn{display:inline-block;border:none;border-radius:10px;padding:10px 14px;font-weight:800;font-size:13px;margin:4px 4px 0 0;text-decoration:none;cursor:pointer}
.go{background:#16a34a;color:#fff}
.warn{background:#f59e0b;color:#fff}
.danger{background:#ef4444;color:#fff}
.ghost{background:#e2e8f0;color:#0f172a}
.zap{background:#25D366;color:#fff}
.back{font-size:13px;color:#38bdf8;font-weight:800;text-decoration:none}
.foot{color:#64748b;font-size:11px;text-align:center;margin-top:16px}
.foot a{color:#38bdf8;text-decoration:none}
input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:14px;font-family:inherit;margin-bottom:6px;background:#fff;color:#0f172a}
.row{display:flex;gap:6px}.row>*{flex:1}
.item{display:flex;gap:8px;align-items:center;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:9px;margin-top:6px}
.item .tx{flex:1;min-width:0;font-size:13px}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:8px;padding:2px 8px;margin-top:4px}
.ok{background:#dcfce7;color:#166534}.late{background:#fee2e2;color:#991b1b}.soon{background:#fef3c7;color:#92400e}.info{background:#e0f2fe;color:#075985}
.streak{font-size:26px;font-weight:900;color:#f59e0b}
.micbtn{border:1px solid #cbd5e1;background:#fff;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer;flex:none}
</style>


<link rel="stylesheet" href="/assets/brand.css?v=20261013">
<link rel="stylesheet" href="/assets/app-shell.css?v=20261013b">

</head>
<body data-spark-page="agenda" data-spark-layout="simple">
<div class="wrap">
<a class="back" href="/">← sparkbr.online</a>
<div style="font-size:13px;color:#38bdf8;font-weight:800;margin-top:8px">⚡ SPARK APPS + IA</div>
<h1>📅 Agenda da Família</h1>
<div class="sub">Um calendário só: escola, médico, obra, igreja. Quem leva, quando, onde.</div>

<div class="card"><b>🏠 Hoje da casa</b><div id="hoje"></div></div>
<div class="secao">➕ Novo compromisso (ou 🎤 fale)</div>
<div class="card"><div class="row"><input id="e-t" placeholder="Ex: dentista da Ana"><button class="micbtn" id="e-mic">🎤</button></div>
<div class="row"><input id="e-d" type="date"><input id="e-h" type="time"></div>
<input id="e-q" list="fam-list" placeholder="Quem vai / quem leva (ex: pai leva)">
<datalist id="fam-list"></datalist>
<button class="btn go" id="e-add">Adicionar</button></div>
<div class="secao">📋 Próximos</div>
<div class="card"><div id="lista"></div></div>

<div class="foot">Grátis para sempre · <a href="/">todos os apps</a> · <a href="/familia/">Família</a> · <a href="/dose/">Dose</a> · <a href="/escola/">Escola</a></div>
</div>
<script src="/spark-casa.js?v=5"></script>
<script>

function load(){ return S.get("agenda", []); }
function save(a){ S.set("agenda", a); }
function render(){
  var a=load(), t=S.today(), hj="", fut="";
  a.sort(function(x,y){ return ((x.d||"9")+(x.h||""))<((y.d||"9")+(y.h||""))?-1:1; });
  a.forEach(function(e){
    var h='<div class="item"><div class="tx"><b>'+S.esc(e.t)+'</b><br><span class="meta">'+S.esc(e.d||"")+" "+S.esc(e.h||"")+" - "+S.esc(e.q||"")+'</span></div>'
      +'<button class="btn ghost" data-ok="'+e.id+'">ok</button><button class="btn ghost" data-del="'+e.id+'">x</button></div>';
    if(e.d===t) hj+=h; else fut+=h;
  });
  document.getElementById("hoje").innerHTML=hj||'<div class="meta">Nada hoje. Que paz.</div>';
  document.getElementById("lista").innerHTML=fut||'<div class="meta">Nenhum próximo. Adicione o primeiro.</div>';
  var oks=document.querySelectorAll("[data-ok]");
  for(var i=0;i<oks.length;i++){ (function(el){ el.onclick=function(){ var id=el.getAttribute("data-ok"); save(load().filter(function(e){return e.id!==id;})); S.streakTouch("agenda"); S.toast("Cumprido!"); render(); }; })(oks[i]); }
  var ds=document.querySelectorAll("[data-del]");
  for(var j=0;j<ds.length;j++){ (function(el){ el.onclick=function(){ var id=el.getAttribute("data-del"); save(load().filter(function(e){return e.id!==id;})); render(); }; })(ds[j]); }
}
document.getElementById("e-add").onclick=function(){
  var t=document.getElementById("e-t").value.trim();
  if(t.length<2){ S.toast("O que?"); return; }
  var a=load(); a.push({id:S.uid(),t:t,d:document.getElementById("e-d").value,h:document.getElementById("e-h").value,q:document.getElementById("e-q").value.trim()});
  save(a);
  document.getElementById("e-t").value=""; document.getElementById("e-q").value="";
  render(); S.toast("Na agenda!");
};
S.holdMic(document.getElementById("e-mic"), function(txt){ document.getElementById("e-t").value=txt.slice(0,60); S.toast("Confira data e hora."); });
S.familia(function(f){ try{
  if(!f||!f.length)return;
  var dl=document.getElementById("fam-list");
  dl.innerHTML=f.filter(function(m){return m.tipo!=="pet";}).map(function(m){return '<option value="'+S.esc(m.nome)+'">';}).join("");
}catch(e){} });
render();

</script>

<script src="/navegador/bridge/spark-family.js?v=2.1.0"></script>
</body>
</html>
