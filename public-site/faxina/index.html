<div class="wrap">

<h1>🧹 Faxina da Casa</h1>
<div class="sub">10 minutos por dia por cômodo. Sábado livre, sem briga.</div>

<div class="card"><b>✨ Foco de hoje: <span id="foco">-</span></b><div class="meta" id="streak">Feche o cômodo do dia para acender a sequência.</div><div class="bar"><i id="bar" style="width:0%"></i></div></div>
<div class="card"><div id="comodos"></div></div>
<div class="card"><input id="resp" placeholder="Quem faz hoje? (ex: revezamento: Ana)"><button class="btn go" id="salvar">Salvar responsável</button></div>

<div class="foot">Grátis para sempre · <a href="/">todos os apps</a> · <a href="/familia/">Família</a> · <a href="/agenda/">Agenda</a> · <a href="/mural/">Mural</a></div>
</div>
<script src="/spark-casa.js?v=1"></script>
<script>

var COMODOS=[["cozinha","Cozinha",["Louça lavada","Fogão limpo","Chão passado","Lixo trocado"]],["banheiro","Banheiro",["Vaso + pia","Chão + tapete","Lixo trocado"]],["quartos","Quartos",["Camas feitas","Roupa no cesto","Chão passado"]],["sala","Sala",["Pó nos móveis","Chão passado","Almofadas no lugar"]],["quintal","Quintal/Área",["Varreu","Plantas regadas","Lixo pra fora"]],["roupas","Roupas",["Máquina batida","Varal estendido","Roupa dobrada"]]];
function load(){ return S.get("faxina", {feitos:{},resp:""}); }
function save(o){ S.set("faxina", o); }
function focoHoje(){ try{ var d=new Date(); var n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5); return COMODOS[n%COMODOS.length][0]; }catch(e){ return "cozinha"; } }
function render(){
  var o=load(), f=focoHoje(), t=S.today(), n=0, html="";
  document.getElementById("foco").textContent=f;
  document.getElementById("resp").value=o.resp||"";
  COMODOS.forEach(function(c){
    var key=c[0], tasks=c[2], done=(o.feitos[key]===t);
    if(done)n++;
    html+='<div class="item"><div class="tx"><b>'+(key===f?"⭐ ":"")+c[1]+'</b><br><span class="meta">'+tasks.join(" · ")+'</span><br>'+(done?'<span class="badge ok">feito hoje</span>':'<span class="badge soon">foco '+(key===f?"de hoje":"da semana")+'</span>')+'</div>'
      +(!done?'<button class="btn go" data-f="'+key+'">Fechei</button>':'')+'</div>';
  });
  document.getElementById("comodos").innerHTML=html;
  document.getElementById("bar").style.width=Math.round(n/COMODOS.length*100)+"%";
  var st=S.streakGet("faxina");
  document.getElementById("streak").textContent=st.dias?("🔥 "+st.dias+" dia(s) de casa brilhando"):"Feche o cômodo do dia para acender a sequência.";
  var bs=document.querySelectorAll("[data-f]");
  for(var i=0;i<bs.length;i++){ (function(el){ el.onclick=function(){ var oo=load(); oo.feitos[el.getAttribute("data-f")]=S.today(); save(oo); S.streakTouch("faxina"); S.toast("Cômodo fechado!"); render(); }; })(bs[i]); }
}
document.getElementById("salvar").onclick=function(){ var o=load(); o.resp=document.getElementById("resp").value.trim(); save(o); S.toast("Combinado!"); };
render();

</script>
