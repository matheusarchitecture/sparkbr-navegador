<script>
const petState = {
  activeMarket: 'cobasi',
  markets: {
    cobasi: { name: 'Cobasi', color: '#EA580C', rate: '0%', multiplier: 1.0 },
    petz: { name: 'Petz', color: '#2563EB', rate: '0%', multiplier: 1.04 },
    casaracao: { name: 'Casa da Ração', color: '#16A34A', rate: '0%', multiplier: 0.93 },
    chimbica: { name: 'Chimbica', color: '#D97706', rate: '0%', multiplier: 0.90 },
    ponto: { name: 'Ponto das Rações', color: '#7C3AED', rate: '0%', multiplier: 0.94 },
    latemia: { name: 'Late Mia & Cia', color: '#DB2777', rate: '0%', multiplier: 0.96 }
  },
  items: [],
  isRecording: false
};
var state = petState;
function switchPetTab(id, el) {
  document.querySelectorAll('.tab-content').forEach(function (t) { t.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(function (b) { b.classList.remove('active'); });
  var t = document.getElementById('tab-' + id); if (t) t.classList.add('active');
  if (el) el.classList.add('active');
}
function renderChips() {
  document.getElementById('pet-chips').innerHTML = Object.keys(state.markets).map(function (k) {
    return '<button class="market-chip' + (k === state.activeMarket ? ' active' : '') + '" onclick="selectPetMarket(\'' + k + '\')">' + state.markets[k].name + '</button>';
  }).join('');
}
function selectPetMarket(k) {
  state.activeMarket = k; renderChips();
  if (window.renderShoppingList) window.renderShoppingList();
  if (window.updateKPIs) window.updateKPIs();
}
function toggleCheck(id) {
  var it = state.items.find(function (i) { return i.id === id; });
  if (it) { it.checked = !it.checked; if (window.renderShoppingList) window.renderShoppingList(); updateKPIs(); try{window.sparkSync&&window.sparkSync()}catch(_){} }
}
function updateKPIs() {
  var mult = state.markets[state.activeMarket].multiplier, total = 0;
  state.items.forEach(function (i) { if (!i.checked) total += (i.basePrice * mult * i.qty); });
  document.getElementById('kpi-total').textContent = 'R$ ' + total.toFixed(2).replace('.', ',');
  document.getElementById('btn-total-preview').textContent = 'R$ ' + total.toFixed(2).replace('.', ',');
  document.getElementById('kpi-count').textContent = state.items.length + ' itens';
  document.getElementById('kpi-market-name').textContent = state.markets[state.activeMarket].name;
  var best = Math.min.apply(null, Object.keys(state.markets).map(function (k) { return state.markets[k].multiplier; }));
  var diff = total - total / mult * best;
  var tip = document.getElementById('savings-tip');
  if (diff > 0.05) tip.innerHTML = '💡 Nesta lista dá <b>R$ ' + diff.toFixed(2).replace('.', ',') + ' de economia</b> no mais barato!';
  else tip.innerHTML = '💡 Melhor cotação pet da região!';
}
function petAdd() {
  var input = document.getElementById('quick-input'), v = (input.value || '').trim();
  if (!v) return;
  state.items.unshift({ id: Date.now(), name: v, qty: 1, unit: 'un', basePrice: 0, checked: false, ean: '' });
  input.value = '';
  if (window.renderShoppingList) window.renderShoppingList(); updateKPIs(); try{window.sparkSync&&window.sparkSync()}catch(_){}
}
document.addEventListener('DOMContentLoaded', function () { renderChips(); updateKPIs(); });
</script>
